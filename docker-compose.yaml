services:
  chatping-postgres:
    image: postgres:18.1-bookworm
    container_name: chatping-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
    
  chatping-redis:
    image: redis:8.0-bookworm
    container_name: chatping-env-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ${PROJECT_ROOT}/out/redisdata:/data
    restart: always

  chatping-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  postgres-port-forwarder:
    image: alpine/socat:1.8.1.1
    container_name: chatping-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:chatping-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  redis-port-forwarder:
    image: alpine/socat:1.8.1.1
    container_name: chatping-redis-port-forwarder
    command: tcp-listen:6379,fork,reuseaddr tcp-connect:chatping-redis:6379
    ports:
      - "127.0.0.1:6379:6379"
